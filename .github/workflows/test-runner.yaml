name: Runner Validation

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-environment:
    runs-on: self-hosted
    
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Test Sudo Access
        run: |
          echo "Testing sudo command without password..."
          sudo apt-get update -y && sudo apt-get install -y screen
          echo "Sudo successfully validated!"

      - name: 3. Test Docker Access
        run: |
          echo "Testing Docker with np-runner user..."
          docker run --rm hello-world
          echo "Docker successfully validated!"
